<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BeCAPTCHA-Guard — dataset explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0E14;--panel:#121821;--panel2:#0F141C;--grid:#1E2733;--line:#243040;
    --human:#35D0BA;--bot:#F0A93B;--text:#C7D0DB;--muted:#6B7686;
    --ui:"Space Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui)}
  .wrap{max-width:1120px;margin:0 auto;padding:34px 24px 70px}
  header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:10px}
  h1{font-size:20px;margin:0}h1 span{color:var(--human)}
  a.btn{color:#04120E;background:var(--human);text-decoration:none;font-family:var(--mono);font-size:12px;
    padding:8px 12px;border-radius:7px;font-weight:500}
  a.link{color:var(--human);text-decoration:none;font-family:var(--mono);font-size:12px}
  .legend{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 16px}
  .legend b.h{color:var(--human)}.legend b.b{color:var(--bot)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .card .v{font-family:var(--mono);font-size:26px;margin-top:6px}
  .card .v.h{color:var(--human)}.card .v.b{color:var(--bot)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 12px;letter-spacing:.04em}
  canvas{width:100%;display:block}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .thumb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .thumb canvas{height:110px}
  .thumb .lab{font-family:var(--mono);font-size:11px;margin-top:6px}
  .thumb .lab.h{color:var(--human)}.thumb .lab.b{color:var(--bot)}
  .empty{color:var(--muted);text-align:center;padding:50px 10px;font-size:14px}
  .exports{display:flex;gap:10px;flex-wrap:wrap}
  .bars{display:flex;gap:8px;align-items:flex-end;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
  .bar i{width:64%;border-radius:5px 5px 0 0}
  .bar small{color:var(--muted);font-family:var(--mono);font-size:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BeCAPTCHA·<span>Guard</span> — dataset explorer</h1>
    <div class="exports">
      <a class="link" href="/collect-ui">← collect more</a>
      <a class="btn" href="/dataset/export.csv">Export features CSV</a>
      <a class="btn" href="/dataset/export.jsonl">Export raw JSONL</a>
    </div>
  </header>

  <div id="body"><div class="empty">Loading dataset…</div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const C_H='#35D0BA', C_B='#F0A93B';

async function load(){
  let stats, sess;
  try{
    stats=await (await fetch('/dataset/stats')).json();
    sess=(await (await fetch('/dataset/sessions?limit=500')).json()).sessions;
  }catch(e){ $('#body').innerHTML=`<div class="empty">Could not reach the API. Start it with <code>uvicorn api.main:app</code>.</div>`; return; }

  if(!stats.total){ $('#body').innerHTML=`<div class="empty">No sessions collected yet.<br><br>
    <a class="btn" href="/collect-ui">Start collecting →</a></div>`; return; }

  $('#body').innerHTML=`
    <div class="legend">labels: <b class="h">human</b> vs <b class="b">bot families</b> — collected via the guided protocol</div>
    <div class="cards">
      <div class="card"><div class="k">TOTAL TRIALS</div><div class="v">${stats.total}</div></div>
      <div class="card"><div class="k">HUMAN</div><div class="v h">${stats.n_human}</div></div>
      <div class="card"><div class="k">BOT</div><div class="v b">${stats.n_bot}</div></div>
      <div class="card"><div class="k">PARTICIPANTS</div><div class="v">${stats.participants}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>TRIALS BY LABEL</h2><div class="bars" id="labelbars"></div></div>
      <div class="panel"><h2>AVERAGE SESSION METRICS</h2>
        <div style="font-family:var(--mono);font-size:13px;line-height:2.1;color:var(--muted)">
          <div>mean duration&nbsp;&nbsp;<b style="color:var(--text)">${stats.avg_duration_ms} ms</b></div>
          <div>mean mouse points&nbsp;&nbsp;<b style="color:var(--text)">${stats.avg_mouse_points}</b></div>
          <div>mean straightness&nbsp;&nbsp;<b style="color:var(--text)">${stats.avg_straightness}</b></div>
          <div>mean speed CV&nbsp;&nbsp;<b style="color:var(--text)">${stats.avg_speed_cv}</b></div>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>PATH STRAIGHTNESS — human vs bot</h2><canvas id="h1" height="200"></canvas></div>
      <div class="panel"><h2>SPEED VARIABILITY (CV) — human vs bot</h2><canvas id="h2" height="200"></canvas></div>
    </div>
    <div class="panel"><h2>TRAJECTORY GALLERY (click-to-target trials)</h2>
      <div class="gallery" id="gallery"></div></div>`;

  // label bars
  const entries=Object.entries(stats.by_label).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...entries.map(e=>e[1]));
  $('#labelbars').innerHTML=entries.map(([l,n])=>{
    const col=l==='human'?C_H:C_B;
    return `<div class="bar"><span style="font-family:var(--mono);font-size:11px">${n}</span>
      <i style="height:${(n/mx)*120}px;background:${col}"></i><small>${l.replace('_','<br>')}</small></div>`;
  }).join('');

  // histograms (labelled split)
  hist($('#h1'), sess.map(s=>({v:s.straightness,bot:s.is_bot})), 0, 1);
  const cvmax=Math.max(0.6,...sess.map(s=>s.speed_cv));
  hist($('#h2'), sess.map(s=>({v:s.speed_cv,bot:s.is_bot})), 0, cvmax);

  // trajectory gallery: fetch a mix of human + bot target-acquisition trials
  const targets=sess.filter(s=>s.task==='target_acquisition');
  const pick=[...targets.filter(s=>!s.is_bot).slice(0,6), ...targets.filter(s=>s.is_bot).slice(0,6)];
  const g=$('#gallery');
  if(!pick.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">No target-acquisition trials yet.</div>'; }
  for(const s of pick){
    const div=document.createElement('div'); div.className='thumb';
    const cv=document.createElement('canvas'); div.appendChild(cv);
    const lab=document.createElement('div'); lab.className='lab '+(s.is_bot?'b':'h'); lab.textContent=s.label;
    div.appendChild(lab); g.appendChild(div);
    try{ const raw=await (await fetch('/dataset/session/'+s.id)).json(); drawTraj(cv, raw.mouse, s.is_bot); }catch(e){}
  }
}

function fit(c,h){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=h*devicePixelRatio;
  const x=c.getContext('2d');x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);return [x,r.width,h];}

function hist(c, data, lo, hi){
  const [x,w,h]=fit(c,200); const bins=20;
  const H=new Array(bins).fill(0), B=new Array(bins).fill(0);
  data.forEach(d=>{ let k=Math.floor((d.v-lo)/(hi-lo)*bins); k=Math.max(0,Math.min(bins-1,k));
    (d.bot?B:H)[k]++; });
  const mx=Math.max(1,...H,...B); const bw=w/bins;
  x.clearRect(0,0,w,h);
  for(let i=0;i<bins;i++){
    const hh=H[i]/mx*(h-24), bh=B[i]/mx*(h-24);
    x.fillStyle='rgba(53,208,122,.55)'; x.fillRect(i*bw+1,h-20-hh,bw-2,hh);
    x.fillStyle='rgba(240,169,59,.55)'; x.fillRect(i*bw+1,h-20-bh,bw-2,bh);
  }
  x.strokeStyle='#243040'; x.beginPath(); x.moveTo(0,h-20); x.lineTo(w,h-20); x.stroke();
  x.fillStyle='#6B7686'; x.font='10px monospace';
  x.fillText(lo.toFixed(2),2,h-6); x.fillText(hi.toFixed(2),w-28,h-6);
}

function drawTraj(c, mouse, isBot){
  const [x,w,h]=fit(c,110);
  const xs=mouse.x, ys=mouse.y; if(!xs||xs.length<2){return;}
  let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sx=(maxx-minx)||1, sy=(maxy-miny)||1, pad=10;
  const X=i=>pad+((xs[i]-minx)/sx)*(w-2*pad), Y=i=>pad+((ys[i]-miny)/sy)*(h-2*pad);
  x.clearRect(0,0,w,h); x.lineWidth=1.6; x.lineCap='round';
  x.strokeStyle=isBot?C_B:C_H;
  x.beginPath(); x.moveTo(X(0),Y(0)); for(let i=1;i<xs.length;i++)x.lineTo(X(i),Y(i)); x.stroke();
  x.fillStyle=isBot?C_B:C_H; x.beginPath(); x.arc(X(xs.length-1),Y(xs.length-1),2.5,0,7); x.fill();
}

load();
</script>
</body>
</html>
