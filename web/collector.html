<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeCAPTCHA-Guard — behavioural verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0E14; --panel:#121821; --panel2:#0F141C; --grid:#1E2733;
    --line:#243040; --human:#35D0BA; --bot:#F0A93B;
    --text:#C7D0DB; --muted:#6B7686;
    --allow:#35D07A; --challenge:#F0A93B; --block:#E5484D;
    --ui:"Space Grotesk",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);
       -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 24px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
         border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--human)}
  .sub{color:var(--muted);font-size:13px;max-width:52ch}
  .env{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .env b{color:var(--text);font-weight:500}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  .panel h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 14px;letter-spacing:.04em}
  /* the hero: live signal trace */
  canvas{width:100%;height:230px;display:block;background:
    repeating-linear-gradient(0deg,transparent,transparent 22px,var(--grid) 22px,var(--grid) 23px),
    repeating-linear-gradient(90deg,transparent,transparent 22px,var(--grid) 22px,var(--grid) 23px),
    var(--panel2);border-radius:8px}
  .capture{margin-top:16px;padding:22px;border:1px dashed var(--line);border-radius:8px;background:var(--panel2)}
  .check{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
  .box{width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;flex:none;transition:.15s}
  .check.on .box{background:var(--human);border-color:var(--human)}
  .box svg{opacity:0;transition:.15s}.check.on .box svg{opacity:1}
  input[type=text]{width:100%;margin-top:16px;background:var(--ink);border:1px solid var(--line);
    color:var(--text);border-radius:6px;padding:11px 12px;font-family:var(--mono);font-size:13px}
  input[type=text]:focus{outline:none;border-color:var(--human)}
  button{margin-top:16px;width:100%;background:var(--human);color:#04120E;border:none;
    border-radius:7px;padding:13px;font-family:var(--ui);font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:not-allowed}
  .verdict{text-align:center;padding:26px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
  .action{font-size:30px;font-weight:700;letter-spacing:-.01em}
  .action.ALLOW{color:var(--allow)}.action.CHALLENGE{color:var(--challenge)}.action.BLOCK{color:var(--block)}
  .gauge{height:8px;border-radius:4px;background:var(--grid);margin:18px 0 6px;overflow:hidden}
  .gauge>i{display:block;height:100%;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .rows{font-family:var(--mono);font-size:12px;margin-top:16px}
  .rows div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grid)}
  .rows span:first-child{color:var(--muted)}
  .why{margin-top:14px;font-size:12px;color:var(--muted)}
  .why li{margin:3px 0}
  .idle{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px}
  a.dash{color:var(--human);font-size:12px;text-decoration:none;font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>BeCAPTCHA·<span>Guard</span></h1>
      <div class="sub">Move to the checkbox, tick it, type the phrase, then verify. Your motion is analysed by a behavioural model — no puzzles.</div>
    </div>
    <div class="env" id="env">env probe…</div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>LIVE MOTION TRACE — velocity encoded teal → amber</h2>
      <canvas id="scope" width="620" height="230"></canvas>
      <div class="capture">
        <div class="check" id="check"><div class="box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="#04120E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div><div>I am a human</div></div>
        <input id="phrase" type="text" placeholder="type: quick brown fox" autocomplete="off" spellcheck="false"/>
        <button id="verify" disabled>Verify</button>
      </div>
    </div>

    <div class="panel">
      <h2>RISK VERDICT <a class="dash" href="/dashboard">forensic dashboard →</a></h2>
      <div id="out"><div class="idle">Awaiting a verification attempt…</div></div>
    </div>
  </div>
</div>

<script>
// ------- telemetry capture -------
const state = { mx:[], my:[], mt:[], down:{}, dwell:[], flight:[], lastUp:null,
                clicks:0, inter:[], press:[], lastClick:null, downTs:null,
                scroll:false, focus:false, t0:performance.now() };
const scope = document.getElementById('scope'), ctx = scope.getContext('2d');
function fitCanvas(){ const r=scope.getBoundingClientRect(); scope.width=r.width*devicePixelRatio;
  scope.height=r.height*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',fitCanvas); fitCanvas();

let bounds={minx:1e9,miny:1e9,maxx:-1e9,maxy:-1e9};
addEventListener('mousemove', e=>{
  const t=performance.now(); state.mx.push(e.clientX); state.my.push(e.clientY); state.mt.push(t);
  bounds.minx=Math.min(bounds.minx,e.clientX); bounds.maxx=Math.max(bounds.maxx,e.clientX);
  bounds.miny=Math.min(bounds.miny,e.clientY); bounds.maxy=Math.max(bounds.maxy,e.clientY);
  if(state.mx.length>3000){state.mx.shift();state.my.shift();state.mt.shift();}
  drawScope();
});
addEventListener('scroll',()=>state.scroll=true,{passive:true});
addEventListener('focus',()=>state.focus=true);
document.addEventListener('mousedown',e=>{state.downTs=performance.now();});
document.addEventListener('mouseup',e=>{
  const t=performance.now();
  if(state.downTs){state.press.push(t-state.downTs);}
  state.clicks++;
  if(state.lastClick) state.inter.push(t-state.lastClick);
  state.lastClick=t;
});
document.addEventListener('keydown',e=>{ if(!(e.key in state.down)) state.down[e.key]=performance.now(); });
document.addEventListener('keyup',e=>{
  const t=performance.now();
  if(e.key in state.down){ state.dwell.push(t-state.down[e.key]); delete state.down[e.key]; }
  if(state.lastUp!==null) state.flight.push(t-state.lastUp);
  state.lastUp=t;
});

function drawScope(){
  const w=scope.clientWidth,h=scope.clientHeight; ctx.clearRect(0,0,w,h);
  const n=state.mx.length; if(n<2) return;
  const pad=16, sx=(bounds.maxx-bounds.minx)||1, sy=(bounds.maxy-bounds.miny)||1;
  const X=i=>pad+((state.mx[i]-bounds.minx)/sx)*(w-2*pad);
  const Y=i=>pad+((state.my[i]-bounds.miny)/sy)*(h-2*pad);
  let vmax=1e-6; const v=[];
  for(let i=1;i<n;i++){const dt=(state.mt[i]-state.mt[i-1])||16;
    const s=Math.hypot(state.mx[i]-state.mx[i-1],state.my[i]-state.my[i-1])/dt; v.push(s); vmax=Math.max(vmax,s);}
  ctx.lineWidth=2; ctx.lineCap='round';
  for(let i=1;i<n;i++){ const f=Math.min(1,v[i-1]/vmax);
    ctx.strokeStyle=`rgb(${53+ (240-53)*f},${208+(169-208)*f},${186+(59-186)*f})`;
    ctx.beginPath(); ctx.moveTo(X(i-1),Y(i-1)); ctx.lineTo(X(i),Y(i)); ctx.stroke(); }
  ctx.fillStyle='#35D0BA'; ctx.beginPath(); ctx.arc(X(n-1),Y(n-1),3.5,0,7); ctx.fill();
}

// ------- environment probe -------
const env=document.getElementById('env');
const wd = navigator.webdriver===true;
env.innerHTML = `webdriver=<b>${wd}</b> · ua=<b>${navigator.platform||'?'}</b> · cores=<b>${navigator.hardwareConcurrency||'?'}</b>`;

// ------- checkbox + enable -------
const check=document.getElementById('check'), verify=document.getElementById('verify');
let ticked=false;
check.addEventListener('click',()=>{ ticked=!ticked; check.classList.toggle('on',ticked);
  verify.disabled=!ticked; });

// ------- submit -------
verify.addEventListener('click', async ()=>{
  verify.disabled=true; verify.textContent='Analysing…';
  const total=performance.now()-state.t0;
  const nEvents=state.mx.length+state.dwell.length+state.clicks;
  const payload={
    mouse:{x:state.mx.slice(),y:state.my.slice(),t:state.mt.map(v=>v-state.mt[0])},
    keystroke:{dwell:state.dwell,flight:state.flight},
    clicks:{n_clicks:state.clicks,inter_click_ms:state.inter,press_ms:state.press},
    session:{total_ms:total,n_events:nEvents,event_rate_hz:nEvents/(total/1000+1e-6),
             has_focus_events:state.focus,has_scroll:state.scroll,webdriver_flag:wd},
    baseline:"xgboost"
  };
  try{
    const r=await fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    render(await r.json());
  }catch(e){ document.getElementById('out').innerHTML=`<div class="idle">Scoring failed: ${e}</div>`; }
  verify.disabled=false; verify.textContent='Verify';
});

function render(d){
  const col={ALLOW:'var(--allow)',CHALLENGE:'var(--challenge)',BLOCK:'var(--block)'}[d.action];
  const pct=Math.round(d.risk*100);
  document.getElementById('out').innerHTML=`
    <div class="verdict">
      <div class="action ${d.action}">${d.action}</div>
      <div class="gauge"><i style="width:${pct}%;background:${col}"></i></div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">fused risk ${d.risk.toFixed(3)}</div>
    </div>
    <div class="rows">
      <div><span>deep model p(bot)</span><span>${d.p_bot_deep.toFixed(3)}</span></div>
      <div><span>${d.baseline_model} p(bot)</span><span>${d.p_bot_baseline.toFixed(3)}</span></div>
      <div><span>attention peaks (path %)</span><span>${d.attention_peaks_path_fraction.map(x=>Math.round(x*100)).join(' · ')}</span></div>
      <div><span>request id</span><span>${d.request_id.slice(0,8)}</span></div>
    </div>
    <div class="why"><b style="color:var(--text)">why:</b><ul>${d.reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div>`;
}
</script>
</body>
</html>
