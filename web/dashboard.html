<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BeCAPTCHA-Guard — forensic dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0E14;--panel:#121821;--panel2:#0F141C;--grid:#1E2733;--line:#243040;
    --human:#35D0BA;--bot:#F0A93B;--text:#C7D0DB;--muted:#6B7686;
    --allow:#35D07A;--challenge:#F0A93B;--block:#E5484D;
    --ui:"Space Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui)}
  .wrap{max-width:1120px;margin:0 auto;padding:36px 24px 70px}
  header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  h1{font-size:20px;margin:0}h1 span{color:var(--human)}
  a{color:var(--human);text-decoration:none;font-family:var(--mono);font-size:12px}
  .chain{font-family:var(--mono);font-size:12px}
  .ok{color:var(--allow)}.bad{color:var(--block)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .card .v{font-family:var(--mono);font-size:26px;margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 14px;letter-spacing:.04em}
  canvas{width:100%;height:180px;display:block}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid)}
  th{color:var(--muted);font-weight:500}
  .pill{padding:2px 8px;border-radius:20px;font-size:11px}
  .ALLOW{background:rgba(53,208,122,.14);color:var(--allow)}
  .CHALLENGE{background:rgba(240,169,59,.14);color:var(--challenge)}
  .BLOCK{background:rgba(229,72,77,.14);color:var(--block)}
  .bars{display:flex;gap:10px;align-items:flex-end;height:150px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
  .bar i{width:70%;border-radius:6px 6px 0 0;transition:height .5s}
  .bar small{color:var(--muted);font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BeCAPTCHA·<span>Guard</span> — forensic console</h1>
    <div><span class="chain" id="chain">chain: …</span> &nbsp; <a href="/">← collector</a></div>
  </header>

  <div class="cards">
    <div class="card"><div class="k">TOTAL DECISIONS</div><div class="v" id="c-total">0</div></div>
    <div class="card"><div class="k">MEDIAN LATENCY</div><div class="v" id="c-lat">–</div></div>
    <div class="card"><div class="k">BLOCK RATE</div><div class="v" id="c-block">–</div></div>
    <div class="card"><div class="k">MEAN RISK</div><div class="v" id="c-risk">–</div></div>
  </div>

  <div class="grid2">
    <div class="panel"><h2>ACTION DISTRIBUTION</h2><div class="bars" id="bars"></div></div>
    <div class="panel"><h2>RISK OVER TIME (deep p(bot))</h2><canvas id="spark" width="520" height="180"></canvas></div>
  </div>

  <div class="panel">
    <h2>RECENT DECISIONS</h2>
    <table><thead><tr><th>time</th><th>action</th><th>risk</th><th>deep</th><th>baseline</th><th>pts</th><th>ms</th><th>id</th></tr></thead>
    <tbody id="tb"></tbody></table>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
async function tick(){
  let d; try{ d=await (await fetch('/events?limit=200')).json(); }catch(e){ return; }
  const ev=d.events||[];
  $('chain').innerHTML = d.chain_valid? 'chain: <span class="ok">VERIFIED ✓</span>' : 'chain: <span class="bad">TAMPERED ✗</span>';
  $('c-total').textContent=d.total||ev.length;
  if(!ev.length) return;
  const lat=ev.map(e=>e.latency_ms).filter(x=>x!=null).sort((a,b)=>a-b);
  $('c-lat').textContent=lat.length? lat[Math.floor(lat.length/2)].toFixed(1)+'ms':'–';
  const blocks=ev.filter(e=>e.action==='BLOCK').length;
  $('c-block').textContent=Math.round(100*blocks/ev.length)+'%';
  $('c-risk').textContent=(ev.reduce((s,e)=>s+(e.risk||0),0)/ev.length).toFixed(3);

  const counts={ALLOW:0,CHALLENGE:0,BLOCK:0}; ev.forEach(e=>counts[e.action]=(counts[e.action]||0)+1);
  const mx=Math.max(1,...Object.values(counts));
  $('bars').innerHTML=['ALLOW','CHALLENGE','BLOCK'].map(a=>{
    const col={ALLOW:'var(--allow)',CHALLENGE:'var(--challenge)',BLOCK:'var(--block)'}[a];
    return `<div class="bar"><span style="font-family:var(--mono);font-size:12px">${counts[a]||0}</span>
      <i style="height:${(counts[a]/mx)*120}px;background:${col}"></i><small>${a}</small></div>`;}).join('');

  const c=$('spark'),x=c.getContext('2d'); const r=c.getBoundingClientRect();
  c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const w=c.clientWidth,h=c.clientHeight; x.clearRect(0,0,w,h);
  const series=ev.map(e=>e.p_bot_deep??0); const n=series.length;
  x.strokeStyle='#243040';x.beginPath();x.moveTo(0,h*0.5);x.lineTo(w,h*0.5);x.stroke();
  x.lineWidth=2;x.strokeStyle='#35D0BA';x.beginPath();
  series.forEach((v,i)=>{const px=n>1?i/(n-1)*w:0,py=h-v*h; i?x.lineTo(px,py):x.moveTo(px,py);});
  x.stroke();

  $('tb').innerHTML=ev.slice().reverse().slice(0,25).map(e=>`<tr>
    <td>${new Date(e.ts*1000).toLocaleTimeString()}</td>
    <td><span class="pill ${e.action}">${e.action}</span></td>
    <td>${(e.risk??0).toFixed(3)}</td><td>${(e.p_bot_deep??0).toFixed(3)}</td>
    <td>${(e.p_bot_baseline??0).toFixed(3)}</td><td>${e.n_mouse_points??'–'}</td>
    <td>${e.latency_ms??'–'}</td><td>${(e.request_id||'').slice(0,8)}</td></tr>`).join('');
}
tick(); setInterval(tick,2500);
</script>
</body>
</html>
